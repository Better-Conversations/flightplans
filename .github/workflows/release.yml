name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
  push:
    tags:
      - '**'

jobs:
  run-script-and-release:
    runs-on: ubuntu-latest
    env:
      COURSE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: |
          bundle install --without development

      - name: Lint flight plans
        run: bin/lint-flight-plans

      - name: Create tag if triggered by workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Set course version
        run: |
          # Replace slashes with hyphens while keeping the 'v' prefix
          VERSION=$(echo ${{ github.ref_name }} | sed 's/\//-/g')
          echo "COURSE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Make release artifacts
        run: |
          bin/make-release ${{ env.COURSE_VERSION }}
          bin/zip-outputs ${{ env.COURSE_VERSION }}

      - name: Create and upload release
        run: |
          # Create release with all course artifacts
          gh release create ${{ github.ref_name }} \
            json-outputs-experience-${{ env.COURSE_VERSION }}.zip \
            json-outputs-bc-ai-${{ env.COURSE_VERSION }}.zip \
            --title ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
